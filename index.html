<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA FASHION</title><style>
:root{--maroon:#64111e;--gold:#b68a3a;--cream:#fffaf2;--ink:#30151a;--soft:#f7eee6}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}button{font:inherit}.top{background:var(--maroon);color:#fff;text-align:center;padding:7px;font-size:12px}.head{height:66px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0001}.logo{height:50px;max-width:150px;object-fit:contain}.icons{display:flex;gap:13px;font-size:22px}.hero{margin:10px 10px 0;border-radius:14px;overflow:hidden;position:relative;background:#eee}.hero img{width:100%;display:block;aspect-ratio:1.8/1;object-fit:cover}.hero .cta{position:absolute;left:8%;bottom:12%;background:var(--maroon);color:#fff;border:0;border-radius:22px;padding:10px 18px;font-weight:bold}.dots{text-align:center;margin:7px}.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9b8a0;margin:0 3px}.dots i:first-child{background:var(--maroon)}h2{text-align:center;font-family:Georgia,serif;margin:20px 0 12px}.cats{display:flex;overflow:auto;gap:13px;padding:0 13px 8px}.cat{min-width:78px;text-align:center;font-size:12px}.cat img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid #ead8bf}.section{padding:0 12px 20px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 14px #00000012}.pic{position:relative}.pic img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.off{position:absolute;left:6px;bottom:6px;background:#18723a;color:#fff;border-radius:4px;padding:4px 6px;font-size:10px;font-weight:bold}.heart{position:absolute;right:7px;top:7px;background:#fff;border:0;border-radius:50%;width:30px;height:30px}.info{padding:9px}.name{font-size:13px;font-weight:700;line-height:1.25;min-height:34px}.rating{font-size:11px;margin:5px 0}.rating b{color:#e69a00}.price{font-weight:800;font-size:18px}.mrp{text-decoration:line-through;color:#999;font-size:11px;margin-left:5px;font-weight:normal}.save{color:#a10e26;font-size:10px;font-weight:bold}.delivery{font-size:10px;color:#287244;margin:6px 0}.btn{width:100%;border:1px solid var(--maroon);border-radius:7px;padding:8px;margin-top:6px;background:#fff;color:var(--maroon);font-weight:700;font-size:12px}.buy{background:var(--maroon);color:#fff}.benefits{background:#f6eadc;padding:15px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center;font-size:10px}.benefits b{display:block;font-size:12px;margin-bottom:3px}.foot{background:#3f0b13;color:#fff;padding:22px 15px;text-align:center;font-size:11px}.foot img{height:48px;filter:brightness(0) invert(1);opacity:.9}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}.gallery img{width:100%;max-height:430px;object-fit:contain;border-radius:12px;background:#f7f2ec}.thumbs{display:flex;gap:7px;overflow:auto;margin:7px 0}.thumbs img{width:58px;height:70px;object-fit:cover;border-radius:6px}.paybox{background:#fff8ef;border:1px solid #ead8bf;padding:15px;border-radius:12px;text-align:center}.paybox img{width:190px;max-width:70%}.input{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:8px}.wa{background:#128c4a;color:#fff;border:0;width:100%;padding:12px;border-radius:9px;font-weight:bold}.note{font-size:11px;color:#777}.hidden{display:none}
</style></head><body>

const cats=[['Lehengas',first('DbqIxyKgCCS')],['Suits',first('DbqIsVKgHJ6')],['Sarees',first('DbqJYcJgEql')],['Kurtis',first('DbqIHTGqHa2')],['Tops',first('DbqJJOvgF7m')],['Dresses',first('DbqI2i6AA5o')]];

function placeOrder(i){let p=imgs[i],n=document.getElementById('nm').value||'',ph=document.getElementById('ph').value||'',ad=document.getElementById('ad').value||'';let msg=`🛍️ NAVYA FASHION – New Order%0A%0A👤 Name: ${encodeURIComponent(n)}%0A📱 Mobile: ${encodeURIComponent(ph)}%0A📍 Address: ${encodeURIComponent(ad)}%0A🛒 Product: ${encodeURIComponent(p[1])}%0A📏 Size: FREE SIZE%0A🔢 Quantity: 1%0A💰 Amount: ₹1,449%0A💳 Payment: UPI%0A%0APlease confirm my order.`;document.getElementById('sheet').innerHTML=`<div style="text-align:center;padding:35px 10px"><div style="font-size:55px">✓</div><h2>Order Placed Successfully!</h2><p>Your order details are ready to send on WhatsApp.</p><button class="wa" onclick="location.href='https://wa.me/${wa}?text=${msg}'">💬 Continue on WhatsApp</button></div>`}

let hi=0;setInterval(()=>{hi=1-hi;document.getElementById('heroImg').src=hi?'hero-2.jpg':'hero-1.jpg'},4500);
</script></body></html>
